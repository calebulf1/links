<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Amazon…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F1E8;color:#1F1E1C;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .card{text-align:center;padding:32px}
  .spin{width:28px;height:28px;margin:0 auto 16px;border:3px solid #D8D1BC;border-top-color:#3E9B6A;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  p{margin:0 0 12px;color:#5A574F}
  a{color:#2B7C55;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <p>Opening Amazon…</p>
  <p><a id="fallback" href="https://www.amazon.com/shop/calebulf?tag=calebulf-20">Tap here if nothing happens</a></p>
</div>
<script>
  // Story link: reads current.json (written by the "Story Link" iOS Shortcut) and opens it in the Amazon app.
  // Expires MAX_AGE_H after it was set (an IG story lives 24h).
  var TAG="calebulf-20", MAX_AGE_H=24;
  function go(raw){
    var u=new URL(raw);
    if(/^(a\.co|amzn\.to|amzn\.com)$/i.test(u.host)){
      // Amazon short link: keep it as-is (tag survives the redirect) but open it through the Amazon app scheme,
      // same as the episode pages. Web fallback if the app is not installed.
      u.searchParams.set("tag",TAG);
      var SWEB=u.href, SAPP="com.amazon.mobile.shopping.web://"+u.host+u.pathname+u.search;
      document.getElementById("fallback").href=SWEB;
      if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
        var st=setTimeout(function(){location.href=SWEB},1600);
        document.addEventListener("visibilitychange",function(){if(document.hidden)clearTimeout(st)});
        location.href=SAPP;
      }else{location.href=SWEB}
      return;
    }
    ["ref","ref_","social_share","th","psc","_encoding","pd_rd_r","pd_rd_w","pd_rd_wg","pf_rd_p","pf_rd_r","content-id"].forEach(function(k){u.searchParams.delete(k)});
    u.searchParams.set("tag",TAG);
    var WEB=u.href;
    var APP="com.amazon.mobile.shopping.web://"+u.host.replace(/^www\./,"")+u.pathname+u.search;
    document.getElementById("fallback").href=WEB;
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
      var t=setTimeout(function(){location.href=WEB},1600);
      document.addEventListener("visibilitychange",function(){if(document.hidden)clearTimeout(t)});
      location.href=APP;
    }else{location.href=WEB}
  }
  var lastMod=NaN;
  fetch("current.json?t="+Date.now(),{cache:"no-store"}).then(function(r){lastMod=Date.parse(r.headers.get("last-modified")||"");return r.json()}).then(function(d){
    var setAt=typeof d.set_at==="number"?d.set_at*1000:Date.parse(d.set_at||"");
    if(isNaN(setAt))setAt=lastMod;var ageH=isNaN(setAt)?1e9:(Date.now()-setAt)/3600000;
    if(!d.url||!/^https?:\/\/(([a-z0-9-]+\.)*amazon\.com|a\.co|amzn\.to|amzn\.com)\//i.test(d.url)||ageH>MAX_AGE_H){
      document.querySelector(".card").innerHTML="<p>That story link has expired.</p><p><a href='https://www.amazon.com/shop/calebulf?tag=calebulf-20'>See everything I recommend on Amazon</a></p>";
      return;
    }
    go(d.url);
  }).catch(function(){location.href="https://www.amazon.com/shop/calebulf?tag=calebulf-20"});
</script>
</body>
</html>
